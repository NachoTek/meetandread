name: Test Suite

# Reusable lint + full-suite job — the single definition used by CI
# (PRs, nightly, release tags). Do not add branch-push triggers here;
# callers own when this runs (issue #71).

on:
  workflow_call:
    inputs:
      fast:
        description: "fast PR lane — additionally deselects requires_qt_widgets"
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4

      # The runner service (NETWORK SERVICE, non-admin) cannot use
      # actions/setup-python: its Windows toolcache installer does an
      # all-users MSI install + HKLM registry cleanup, both elevation-
      # only. Locate a Python 3.10 the service account can run instead:
      # 1) a preinstalled system interpreter (e.g. C:\Python310),
      # 2) the account's per-user install,
      # 3) else install per-user (no elevation required) from the
      #    actions/python-versions bundle.
      - name: Set up Python 3.10 (no elevation)
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            'C:\Python310',
            (Join-Path $env:LOCALAPPDATA 'Programs\Python\Python310'),
            (Join-Path $env:RUNNER_TOOL_CACHE 'PythonUser\3.10.11\x64')
          )
          $found = $null
          foreach ($c in $candidates) {
            $exe = Join-Path $c 'python.exe'
            if (Test-Path $exe) {
              $v = & $exe --version 2>&1
              if ("$v" -match '3\.10\.') { $found = $c; break }
            }
          }
          if (-not $found) {
            Write-Host 'No local Python 3.10 — installing per-user 3.10.11...'
            $tmp = Join-Path $env:RUNNER_TEMP 'pyuser'
            New-Item -ItemType Directory -Force -Path $tmp | Out-Null
            $zip = Join-Path $tmp 'python-3.10.11-win32-x64.zip'
            Invoke-WebRequest -Uri 'https://github.com/actions/python-versions/releases/download/3.10.11-11114431484/python-3.10.11-win32-x64.zip' -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $tmp -Force
            $exe = Join-Path $tmp 'python-3.10.11-amd64.exe'
            $found = Join-Path $env:RUNNER_TOOL_CACHE 'PythonUser\3.10.11\x64'
            New-Item -ItemType Directory -Force -Path $found | Out-Null
            $p = Start-Process -FilePath $exe -ArgumentList '/quiet',"TargetDir=$found",'InstallAllUsers=0','PrependPath=0','Include_test=0','Include_launcher=0','InstallLauncherAllUsers=0' -Wait -PassThru
            if (-not (Test-Path (Join-Path $found 'python.exe'))) {
              # The bundle no-ops when the same per-user 3.10 already
              # exists (exit 0, nothing installed) — use that copy.
              $fallback = Join-Path $env:LOCALAPPDATA 'Programs\Python\Python310'
              if (Test-Path (Join-Path $fallback 'python.exe')) { $found = $fallback }
              else { throw "per-user Python install failed (exit $($p.ExitCode))" }
            }
            Write-Host "Installed per-user Python at $found"
          }
          $resolved = (Resolve-Path $found).Path
          Write-Host "Using Python at $resolved"
          Add-Content -Path $env:GITHUB_PATH -Value $resolved
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $resolved 'Scripts')
          & (Join-Path $resolved 'python.exe') --version

      - run: pip install -e ".[dev]"

      - name: Lint
        run: python -m flake8 src/ --max-line-length=120

      # Issue #86: two lanes instead of one continue-on-error step.
      # Fast lane (PR gate) additionally deselects requires_qt_widgets;
      # nightly/tags keep the full not-slow lane. -n auto resolves to
      # 4 workers on windows-latest. -x fails the step on the first
      # failure instead of deferring to the Verify step.
      - name: Run tests (fast lane)
        if: inputs.fast
        run: |
          python -m pytest -n auto -x -m "not slow and not requires_qt_widgets" --tb=short -q --timeout=300 -p no:qt `
            2>&1 | Out-File test_output.txt -Encoding utf8

      - name: Run tests (full lane)
        if: ${{ !inputs.fast }}
        run: |
          python -m pytest -n auto -x -m "not slow" --tb=short -q --timeout=300 -p no:qt `
            2>&1 | Out-File test_output.txt -Encoding utf8

      - name: Verify tests passed
        if: always()
        run: |
          $content = Get-Content test_output.txt -Raw
          Write-Host $content

          # Check for test failures — the only hard failure condition
          if ($content -match '(\d+) failed') {
            $failed = $Matches[1]
            Write-Error "$failed test(s) failed"
            exit 1
          }

          # Verify pytest actually ran and produced results
          if ($content -match '(\d+) passed') {
            $passed = $Matches[1]
            Write-Host "All $passed tests passed"
            exit 0
          }

          # No results at all — pytest didn't run or crashed before reporting
          Write-Error "No test results found in output"
          exit 1
