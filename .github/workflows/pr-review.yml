name: PR Review Trigger

# Label-gated agent review (issue #71): when the `ready-for-codereview`
# label is added to a PR, send the same HMAC-signed webhook to Hermes so
# the review agent engages. No webhook on unlabeled runs and none on CI
# failure alone — review is requested explicitly by the maintainer.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  trigger-review:
    runs-on: ubuntu-latest
    if: ${{ github.event.label.name == 'ready-for-codereview' }}
    steps:
      - name: Send review-request webhook to Hermes
        env:
          WEBHOOK_SECRET: ${{ secrets.HERMES_WEBHOOK_SECRET }}
          WEBHOOK_URL: https://homelab.nachotek.com/hooks/meetandread-pr
        run: |
          set -euo pipefail

          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          LABEL="${{ github.event.label.name }}"

          echo "Label '$LABEL' added to PR #$PR_NUMBER — requesting agent review"

          # Build the webhook payload — same shape the receiver already
          # knows (pull_request event with a custom action so the Hermes
          # agent can distinguish it)
          PAYLOAD=$(cat <<ENDJSON
          {"action":"review_requested","number":${PR_NUMBER},"repository":{"full_name":"${REPO}"},"label":{"name":"${LABEL}"}}
          ENDJSON
          )

          # Compute HMAC-SHA256 signature (GitHub-style X-Hub-Signature-256)
          SIGNATURE=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $NF}')

          echo "Sending review-request webhook to Hermes..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: pull_request" \
            -H "X-Hub-Signature-256: sha256=${SIGNATURE}" \
            -d "$PAYLOAD")

          echo "Webhook response: HTTP $RESPONSE"

          if [ "$RESPONSE" = "200" ]; then
            echo "Review agent triggered for PR #$PR_NUMBER"
          else
            echo "Webhook delivery failed (HTTP $RESPONSE)"
          fi
