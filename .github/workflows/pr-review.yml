name: PR Review Trigger

# Label-gated agent review (issue #71). When the `ready-for-codereview`
# label is added to a PR, send the same HMAC-signed webhook to Hermes
# so the review agent engages. No webhook fires on CI failure alone.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  trigger-review:
    runs-on: ubuntu-latest
    if: ${{ github.event.label.name == 'ready-for-codereview' }}
    steps:
      - name: Send review-request webhook to Hermes
        env:
          WEBHOOK_SECRET: ${{ secrets.HERMES_WEBHOOK_SECRET }}
          WEBHOOK_URL: https://homelab.nachotek.com/hooks/meetandread-pr
        run: |
          set -euo pipefail

          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"

          echo "ready-for-codereview label added to PR #$PR_NUMBER"

          # Build the webhook payload — uses pull_request event type
          # with a custom action so the Hermes agent can distinguish it.
          # Same shape as the previous ci_failed trigger: number,
          # repository.full_name, plus an action + check_run stub.
          PAYLOAD=$(cat <<ENDJSON
          {"action":"review_requested","number":${PR_NUMBER},"repository":{"full_name":"${REPO}"},"check_run":{"id":${{ github.run_id }},"conclusion":"neutral"}}
          ENDJSON
          )

          # Compute HMAC-SHA256 signature (GitHub-style X-Hub-Signature-256)
          SIGNATURE=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $NF}')

          echo "Sending review-request webhook to Hermes..."
          # --fail-with-body: exit non-zero on HTTP errors (e.g. the
          # empty-signature rejection fork PRs get) instead of failing
          # silently with exit 0.
          RESPONSE=$(curl -s --fail-with-body -o /dev/null -w "%{http_code}" \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: pull_request" \
            -H "X-Hub-Signature-256: sha256=${SIGNATURE}" \
            -d "$PAYLOAD")

          echo "Webhook response: HTTP $RESPONSE"

          # The Hermes gateway answers 202 (accepted for processing) on
          # success; 200 is also acceptable. Anything else is a failure.
          case "$RESPONSE" in
            200|202)
              echo "Review agent triggered for PR #$PR_NUMBER"
              ;;
            *)
              echo "Webhook delivery failed (HTTP $RESPONSE)"
              exit 1
              ;;
          esac
